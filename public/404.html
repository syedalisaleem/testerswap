<!DOCTYPE html>
<html lang="en" data-theme="terminal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Not found | TesterSwap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%23101b17'/%3E%3Crect x='6' y='7' width='20' height='9' rx='3' fill='%232fd9a3'/%3E%3Crect x='6' y='16' width='20' height='9' rx='3' fill='%23f5a92e'/%3E%3C/svg%3E">
<style>
:root { --bg:#0a1210; --surface:#101b17; --surface-2:#15231e; --ink:#dcebe5; --muted:#7e948c; --border:#22332c; --border-strong:#35503f; --yours:#2fd9a3; --theirs:#f5a92e; --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --body:'Instrument Sans','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono',Consolas,monospace; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--body); background:var(--bg); color:var(--ink); min-height:100vh; display:grid; place-items:center; padding:24px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:44px 40px; max-width:520px; width:100%; text-align:center; position:relative; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.4); }
.card::before { content:''; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--yours) 0 50%,var(--theirs) 50%); }
code { font-family:var(--mono); font-size:.75rem; color:var(--muted); letter-spacing:.1em; }
h1 { font-family:var(--display); font-size:2.6rem; margin:14px 0 10px; letter-spacing:-.02em; }
p { color:var(--muted); font-size:.95rem; line-height:1.6; margin-bottom:24px; }
.actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.btn { display:inline-flex; align-items:center; justify-content:center; background:var(--yours); color:var(--bg); border:none; border-radius:8px; padding:10px 18px; font-family:var(--body); font-size:.9rem; font-weight:600; cursor:pointer; text-decoration:none; }
.btn.ghost { background:transparent; border:1px solid var(--border-strong); color:var(--ink); }
.btn:hover { filter:brightness(1.1); }
.status { font-family:var(--mono); font-size:.7rem; letter-spacing:.18em; color:var(--theirs); text-transform:uppercase; }
</style>
</head>
<body>
  <div class="card">
    <p class="status">404 · build failed</p>
    <h1>This route doesn't compile.</h1>
    <p>The page you're after isn't in the codebase. No opt-ins live here — just a dead link.</p>
    <div class="actions">
      <a class="btn" href="/">Back to TesterSwap</a>
      <a class="btn ghost" href="/#/browse">Browse community</a>
    </div>
    <p style="margin-top:22px;margin-bottom:0"><code>error: module not found — 404</code></p>
  </div>
</body>
</html>
